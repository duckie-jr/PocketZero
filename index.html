<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PocketZero" />
  <meta name="theme-color" content="#0a0a1a" />
  <meta name="description" content="A lightweight iOS-inspired web OS shell." />
  <meta property="og:title" content="PocketZero" />
  <meta property="og:description" content="A lightweight iOS-inspired web OS shell." />
  <meta property="og:type" content="website" />
  <title>PocketZero</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Sleep screen — tap anywhere to wake -->
  <div id="sleep-screen">
    <div id="sleep-time"></div>
    <div id="sleep-date"></div>
    <div id="sleep-hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="18 15 12 9 6 15"/>
      </svg>
      <span>tap to wake</span>
    </div>
  </div>

  <!-- Main shell — visible immediately on load -->
  <div id="shell">

    <div id="status-bar">
      <span id="status-time"></span>
    </div>

    <div id="notification-banner"></div>

    <div id="home-screen"></div>

    <div id="app-window" style="display:none"></div>

    <!-- Control Center -->
    <div id="control-center">
      <div id="cc-handle"></div>
      <div id="cc-controls">
        <div class="cc-row">
          <div class="cc-tile" id="cc-darkmode">
            <div class="cc-tile-icon" id="cc-darkmode-icon"></div>
            <span>Dark Mode</span>
          </div>
          <div class="cc-tile" id="cc-sound">
            <div class="cc-tile-icon" id="cc-sound-icon"></div>
            <span>Sound</span>
          </div>
          <div class="cc-tile" id="cc-sleep">
            <div class="cc-tile-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
              </svg>
            </div>
            <span>Sleep</span>
          </div>
        </div>
        <div class="cc-row">
          <label class="cc-slider-label">
            <span>Brightness</span>
            <input type="range" id="cc-brightness" min="20" max="100" value="100" />
          </label>
        </div>
      </div>
    </div>

    <div id="home-bar"></div>

  </div>

  <!-- Dialog overlay -->
  <div id="dialog-overlay" style="
    display: none;
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    align-items: center;
    justify-content: center;
  "></div>

  <script type="module" src="main.js"></script>
</body>
</html>
